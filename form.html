<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulär</title>
</head>
<body>

    <h1>Formulär</h1>
    <hr><br>

    <form action="">
        <label for="first_name">Förnamn:</label>
        <input type="text" id="first_name" name="first_name"><br><br>
        <label for="surname">Efternamn:</label>
        <input type="text" id="surname" name="surname"><br><br>
        <label for="email">E-post:</label>
        <input type="email" id="email" name="email"><br><br>

        <label for="subject">Vilket ämne intresserar dig mest?</label>
        <select name="subject" id="subject">
            <option value="math">Matematik</option>
            <option value="science">Naturkunskap</option>
            <option value="art">Bild</option>
            <option value="programming">Programmering</option>
        </select>
        <br><br>

        <label for="hobbies">Vad tycker du om att göra på din fritid?</label><br>
        <input type="checkbox" id="hobby1" name="hobbies" value="reading">
        <label for="hobby1">Läsa böcker</label><br>
        <input type="checkbox" id="hobby2" name="hobbies" value="sports">
        <label for="hobby2">Sporta</label><br>
        <input type="checkbox" id="hobby3" name="hobbies" value="music">
        <label for="hobby3">Spela/lyssna på musik</label><br>
        <input type="checkbox" id="hobby4" name="hobbies" value="gaming">
        <label for="hobby4">Spela spel</label>
        <br><br>

        <label for="message">Skriv ett meddelande: (valfritt)</label><br>
        <textarea id="message" name="message" rows="4" cols="50"></textarea>
        <br><br>

        <input type="submit" value="Skicka"> 
        <input type="reset" value="Rensa">
        <br><br>

        <a href="index.html">Gå tillbaka</a>
    </form>
    
</body>
</html>
