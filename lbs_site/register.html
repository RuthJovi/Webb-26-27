<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrera</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>LBS</h1>
        <div class="header-links" >
            <a href="login.html">Logga in</a>
            <a href="register.html">Registrera</a>
        </div>
    </header>

    <div class="column-container">
        <h1>Registrera</h1><br><br>
        <form name="register_form">
            <label for="first_name">Förnamn:</label>
            <input type="text" id="first_name" name="first_name"><br><br>
            <label for="surname">Efternamn:</label>
            <input type="text" id="surname" name="surname"><br><br>
            <label for="email">E-post:</label>
            <input type="email" id="email" name="email"><br><br>
            <label for="username">Användarnamn:</label>
            <input type="text" id="username" name="username"><br><br>
            <label for="password">Lösenord:</label>
            <input type="password" id="password" name="password"><br><br>
            <label for="confirm_password">Bekräfta lösenord:</label>
            <input type="password" id="confirm_password" name="confirm_password"><br><br>

            <input class="confirm-btn" type="button" value="Registrera" onclick="register()">
            <input class="reset-btn" type="reset" value="Rensa">
            <br><br>

            <a href="login.html">Har du redan ett konto?</a><br><br>
            <a href="index.html">Gå tillbaka</a>
        </form>
    </div>

    <script src="register.js"></script>

</body>
</html>
